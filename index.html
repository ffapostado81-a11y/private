<!-- ── Connection Overlay ──────────────────────────────────────────── -->
<div id="conn-overlay">
  <div id="conn-box">
    <h2>LUNAR REMOTE</h2>
    <p>Conecte-se ao dispositivo com sua chave de acesso</p>
    <input id="key-input" type="text" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" maxlength="29" autocomplete="off" spellcheck="false">
    <button id="conn-btn" type="button">Conectar</button>
    <div id="conn-error"></div>
  </div>
</div>

<!-- ── Header ──────────────────────────────────────────────────────── -->
<header><div>
  <strong>PRIVATE</strong>
  <span class="status" id="hdr-status"><span id="conn-status-dot" class="dot-off"></span><span id="hdr-status-text">Desconectado</span></span>
</div></header>

<div class="bypass-title">REMOTE BYPASS</div>

<!-- ── Panel ───────────────────────────────────────────────────────── -->
<main id="panel-main" style="display:none"><form autocomplete="off">
<div class="intro">
  <h1>Painel de controle</h1>
  <button type="button" id="btn-reset">Desativar tudo</button>
</div>

<!-- IP info bar -->
<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:10px 16px;border:1px solid #103265;border-radius:10px;background:#04070c;font-size:13px;color:#6a8db8">
  <span id="conn-status-dot2" class="dot-off" style="flex:none"></span>
  <span>Device: <strong id="device-ip-label" style="color:#a4ceff;letter-spacing:.04em">--</strong></span>
  <span style="margin-left:auto">Key: <strong id="active-key-label" style="color:#5e9fff;font-family:'Courier New',monospace;font-size:12px">--</strong></span>
</div>

<div class="grid"><div class="column">

<!-- ── Mira ────────────────────────────────────── -->
<section><h2>Mira</h2>
<div class="row"><label for="c1">Mode</label><select id="c1"><option value="0">Off</option><option value="1">Legit</option><option value="2">Rage</option></select></div>
<div class="row"><label for="c2">FOV</label><div class="range"><input id="c2" type="range" min="1" max="90" step="1" value="1"><output for="c2">1</output></div></div>
<div class="row"><label for="c3">Smooth</label><div class="range"><input id="c3" type="range" min="1" max="20" step="1" value="1"><output for="c3">1</output></div></div>
<div class="row"><label for="c4">Bone</label><select id="c4"><option value="0">Cabeca</option><option value="1">Pescoco</option><option value="2">Peito</option><option value="3">Inteligente</option></select></div>
<div class="row"><label for="c5">Chest-first N</label><div class="range"><input id="c5" type="range" min="1" max="15" step="1" value="1"><output for="c5">1</output></div></div>
<div class="row"><label for="c6">Head delay (s)</label><div class="range"><input id="c6" type="range" min="0" max="2" step="0.1" value="0"><output for="c6">0</output></div></div>
<div class="row"><label for="c7">Silent Aim</label><input id="c7" type="checkbox" role="switch"></div>
<div class="row"><label for="c8">Silent FOV</label><div class="range"><input id="c8" type="range" min="1" max="180" step="1" value="1"><output for="c8">1</output></div></div>
</section>

<!-- ── Disparo ─────────────────────────────────── -->
<section><h2>Disparo</h2>
<div class="row"><label for="c15">No Recoil</label><input id="c15" type="checkbox" role="switch"></div>
<div class="row"><label for="c16">No Spread</label><input id="c16" type="checkbox" role="switch"></div>
<div class="row"><label for="c17">Rapid Fire</label><input id="c17" type="checkbox" role="switch"></div>
<div class="row"><label for="c18">Recoil Mode</label><select id="c18"><option value="0">Off</option><option value="1">Zero</option><option value="2">Stealth</option></select></div>
<div class="row"><label for="c19">Recoil %</label><div class="range"><input id="c19" type="range" min="0" max="100" step="1" value="0"><output for="c19">0</output></div></div>
<div class="row"><label for="c20">Spread %</label><div class="range"><input id="c20" type="range" min="0" max="100" step="1" value="0"><output for="c20">0</output></div></div>
<div class="row"><label for="c21">Fire Delay</label><div class="range"><input id="c21" type="range" min="0" max="500" step="1" value="0"><output for="c21">0</output></div></div>
</section>

</div><div class="column">

<!-- ── ESP ─────────────────────────────────────── -->

<div class="row"><label for="c10">Box</label><input id="c10" type="checkbox" role="switch"></div>
<div class="row"><label for="c11">HP Bar</label><input id="c11" type="checkbox" role="switch"></div>
<div class="row"><label for="c12">Distance</label><input id="c12" type="checkbox" role="switch"></div>

<div class="row"><label for="c24">Speed</label><div class="range"><input id="c24" type="range" min="0.5" max="3" step="0.1" value="0.5"><output for="c24">0.5</output></div></div>
</section>

</div></div>
</form></main>

<!-- ============================================================================
     LUNAR REMOTE — WebSocket Client
     Conecta ao servidor relay e sincroniza controles c1-c24 com lunar::g_cfg
============================================================================= -->
<script>
(function() {
  'use strict';

  // ── Mapeamento: ID do controle → campo da config no servidor ──────────────
  const CONTROL_MAP = {
    c1:  { key: 'aim_mode',          type: 'select-int' },
    c2:  { key: 'aim_fov',           type: 'range-int'  },
    c3:  { key: 'aim_smooth',        type: 'range-int'  },
    c4:  { key: 'aim_bone',          type: 'select-int' },
    c5:  { key: 'chest_first_n',     type: 'range-int'  },
    c6:  { key: 'head_switch_delay', type: 'range-float'},
    c7:  { key: 'silent_aim',        type: 'switch'     },
    c8:  { key: 'silent_fov',        type: 'range-int'  },
    c9:  { key: 'esp',               type: 'switch'     },
    c10: { key: 'esp_box',           type: 'switch'     },
    c11: { key: 'esp_hp',            type: 'switch'     },
    c12: { key: 'esp_dist',          type: 'switch'     },
    c13: { key: 'esp_snap',          type: 'switch'     },
    c14: { key: 'esp_max_dist',      type: 'range-int'  },
    c15: { key: 'norecoil',          type: 'switch'     },
    c16: { key: 'nospread',          type: 'switch'     },
    c17: { key: 'rapidfire',         type: 'switch'     },
    c18: { key: 'recoil_mode',       type: 'select-int' },
    c19: { key: 'recoil_scale',      type: 'range-int'  },
    c20: { key: 'spread_scale',      type: 'range-int'  },
    c21: { key: 'fire_delay',        type: 'range-int'  },
    c22: { key: 'bypass',            type: 'switch'     },
    c23: { key: 'speedhack',         type: 'switch'     },
    c24: { key: 'speed_scale',       type: 'range-float'}
  };

  // Mapeamento inverso: config key → control ID
  const KEY_TO_CTRL = {};
  for (const [cid, spec] of Object.entries(CONTROL_MAP)) {
    KEY_TO_CTRL[spec.key] = { id: cid, type: spec.type };
  }

  // ── Elementos ─────────────────────────────────────────────────────────────
  const overlay     = document.getElementById('conn-overlay');
  const keyInput    = document.getElementById('key-input');
  const connBtn     = document.getElementById('conn-btn');
  const connError   = document.getElementById('conn-error');
  const panelMain   = document.getElementById('panel-main');
  const hdrStatus   = document.getElementById('hdr-status-text');
  const dot1        = document.getElementById('conn-status-dot');
  const dot2        = document.getElementById('conn-status-dot2');
  const ipLabel     = document.getElementById('device-ip-label');
  const keyLabel    = document.getElementById('active-key-label');
  const btnReset    = document.getElementById('btn-reset');

  let ws = null;
  let currentKey = '';
  let reconnectTimer = null;
  let suppressEvents = false; // evita loop ao aplicar sync

  // ── Formatar input da chave (auto-dash) ───────────────────────────────────
  keyInput.addEventListener('input', () => {
    let raw = keyInput.value.replace(/[^A-Fa-f0-9]/g, '').toUpperCase();
    // Inserir traços a cada 4 chars
    const parts = raw.match(/.{1,4}/g) || [];
    keyInput.value = parts.join('-');
  });

  keyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') connBtn.click();
  });

  // ── Conexão ───────────────────────────────────────────────────────────────
  connBtn.addEventListener('click', () => {
    const key = keyInput.value.trim().toUpperCase();
    if (key.replace(/-/g, '').length < 8) {
      connError.textContent = 'Chave muito curta';
      return;
    }
    currentKey = key;
    connect(key);
  });

  function connect(key) {
    if (ws) { ws.onclose = null; ws.close(); }

    connBtn.disabled = true;
    connBtn.textContent = 'Conectando...';
    connError.textContent = '';
    setDots('connecting');
    hdrStatus.textContent = 'Conectando...';

    // Determina URL do WebSocket baseado na URL atual
    const loc = window.location;
    const proto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = proto + '//' + loc.host;

    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      // Autenticar como painel
      ws.send(JSON.stringify({ type: 'auth', key: key, role: 'panel' }));
      connBtn.textContent = 'Conectar';
      connBtn.disabled = false;
    };

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      handleMessage(msg);
    };

    ws.onclose = () => {
      setDots('off');
      hdrStatus.textContent = 'Desconectado';
      // Reconectar automaticamente se já estava autenticado
      if (currentKey && !overlay.classList.contains('hidden')) return;
      if (currentKey) {
        hdrStatus.textContent = 'Reconectando...';
        setDots('connecting');
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => connect(currentKey), 3000);
      }
    };

    ws.onerror = () => {
      connError.textContent = 'Erro de conexao. Verifique o servidor.';
      connBtn.textContent = 'Conectar';
      connBtn.disabled = false;
    };
  }

  // ── Processar mensagens do servidor ────────────────────────────────────────
  function handleMessage(msg) {
    switch (msg.type) {

      case 'init':
        // Autenticado com sucesso — mostrar painel
        overlay.classList.add('hidden');
        panelMain.style.display = '';
        keyLabel.textContent = currentKey;

        // Aplicar config recebida
        applyConfig(msg.config);

        // Status do device
        setDeviceStatus(msg.online, msg.ip);

        // Salvar chave no localStorage
        try { localStorage.setItem('lunar_key', currentKey); } catch {}
        break;

      case 'config_sync':
        // Outro painel mudou algo — sincronizar
        applyConfig(msg.changes);
        break;

      case 'device_status':
        setDeviceStatus(msg.online, msg.ip);
        break;

      case 'ip_update':
        ipLabel.textContent = msg.ip || '--';
        break;

      case 'error':
        connError.textContent = msg.msg || 'Erro desconhecido';
        break;
    }
  }

  // ── Status do device ──────────────────────────────────────────────────────
  function setDeviceStatus(online, ip) {
    if (online) {
      setDots('on');
      hdrStatus.textContent = 'Device online';
      ipLabel.textContent = ip || '--';
    } else {
      setDots('off');
      hdrStatus.textContent = 'Device offline';
      ipLabel.textContent = ip || '--';
    }
  }

  function setDots(state) {
    const cls = state === 'on' ? 'dot-on' : state === 'connecting' ? 'dot-connecting' : 'dot-off';
    dot1.className = cls;
    dot2.className = cls;
  }

  // ── Aplicar config aos controles (server → UI) ────────────────────────────
  function applyConfig(cfg) {
    suppressEvents = true;
    for (const [cfgKey, value] of Object.entries(cfg)) {
      const ctrl = KEY_TO_CTRL[cfgKey];
      if (!ctrl) continue;
      const el = document.getElementById(ctrl.id);
      if (!el) continue;

      if (ctrl.type === 'switch') {
        el.checked = !!value;
      } else if (ctrl.type === 'select-int') {
        el.value = String(value);
      } else {
        el.value = value;
        // Atualizar output associado
        const out = document.querySelector(`output[for="${ctrl.id}"]`);
        if (out) out.value = value;
      }
    }
    suppressEvents = false;
  }

  // ── Enviar mudanças (UI → server) ─────────────────────────────────────────
  function sendChange(controlId) {
    if (suppressEvents || !ws || ws.readyState !== WebSocket.OPEN) return;

    const spec = CONTROL_MAP[controlId];
    if (!spec) return;

    const el = document.getElementById(controlId);
    if (!el) return;

    let value;
    if (spec.type === 'switch') {
      value = el.checked;
    } else if (spec.type === 'select-int' || spec.type === 'range-int') {
      value = parseInt(el.value, 10);
    } else if (spec.type === 'range-float') {
      value = parseFloat(el.value);
    }

    ws.send(JSON.stringify({
      type: 'config_update',
      changes: { [spec.key]: value }
    }));
  }

  // ── Event listeners nos controles ─────────────────────────────────────────
  const form = document.querySelector('form');

  // Range inputs — enviar no input (tempo real enquanto arrasta)
  form.addEventListener('input', (e) => {
    const el = e.target;
    // Atualizar output visual
    if (el.type === 'range') {
      const out = document.querySelector(`output[for="${el.id}"]`);
      if (out) out.value = el.value;
    }
    // Enviar mudanca
    if (CONTROL_MAP[el.id]) {
      sendChange(el.id);
    }
  });

  // Switches (checkbox) — enviar no change
  form.addEventListener('change', (e) => {
    const el = e.target;
    if (CONTROL_MAP[el.id] && el.getAttribute('role') === 'switch') {
      sendChange(el.id);
    }
    // Selects
    if (CONTROL_MAP[el.id] && el.tagName === 'SELECT') {
      sendChange(el.id);
    }
  });

  // ── Desativar tudo ────────────────────────────────────────────────────────
  btnReset.addEventListener('click', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'reset_all' }));
  });

  // ── Auto-reconectar com chave salva ───────────────────────────────────────
  try {
    const saved = localStorage.getItem('lunar_key');
    if (saved) {
      keyInput.value = saved;
    }
  } catch {}

})();
</script>

</body></html>
