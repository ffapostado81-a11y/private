pread</label><input id="c16" type="checkbox" role="switch"></div><div class="row"><label for="c17">Rapid Fire</label><input id="c17" type="checkbox" role="switch"></div><div class="row"><label for="c18">Recoil Mode</label><select id="c18"><option>Off</option><option>Zero</option><option>Stealth</option></select></div><div class="row"><label for="c19">Recoil %</label><div class="range"><input id="c19" type="range" min="0" max="100" step="1" value="0"><output for="c19">0</output></div></div><div class="row"><label for="c20">Spread %</label><div class="range"><input id="c20" type="range" min="0" max="100" step="1" value="0"><output for="c20">0</output></div></div><div class="row"><label for="c21">Fire Delay</label><div class="range"><input id="c21" type="range" min="0" max="500" step="1" value="0"><output for="c21">0</output></div></div></section></div><div class="column"><section><h2>ESP</h2><div class="row"><label for="c9">ESP Enabled</label><input id="c9" type="checkbox" role="switch"></div><div class="row"><label for="c10">Box</label><input id="c10" type="checkbox" role="switch"></div><div class="row"><label for="c11">HP Bar</label><input id="c11" type="checkbox" role="switch"></div><div class="row"><label for="c12">Distance</label><input id="c12" type="checkbox" role="switch"></div><div class="row"><label for="c13">Snapline</label><input id="c13" type="checkbox" role="switch"></div><div class="row"><label for="c14">Max Distance</label><div class="range"><input id="c14" type="range" min="50" max="500" step="1" value="50"><output for="c14">50</output></div></div></section><section><h2>Extras</h2><div class="row"><label for="c22">AC Bypass</label><input id="c22" type="checkbox" role="switch"></div><div class="row"><label for="c23">Speedhack</label><input id="c23" type="checkbox" role="switch"></div><div class="row"><label for="c24">Speed</label><div class="range"><input id="c24" type="range" min="0.5" max="3" step="0.1" value="0.5"><output for="c24">0.5</output></div
